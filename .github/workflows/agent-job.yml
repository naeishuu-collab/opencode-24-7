name: agent-job

# Manual, self-hosted autonomous job: this repository's own Actions minutes run
# an agent that develops this repository (see docs/PHASE0-AUDIT.md, ToS section).
# contents: read on purpose - the agent can propose a diff, never push.
on:
  workflow_dispatch:
    inputs:
      prompt:
        description: Task for the agent
        required: true
        type: string
      model:
        description: provider/model; must be on the verified-free allowlist
        required: false
        default: opencode/deepseek-v4.1-flash-free
        type: string
      verify_cmd:
        description: shell command that must exit 0, e.g. npm test
        required: false
        default: ""
        type: string
      timeout_sec:
        description: wall-clock limit per attempt
        required: false
        default: "1800"
        type: string
      max_attempts:
        description: retries for transient provider errors (1-3)
        required: false
        default: "1"
        type: string

permissions:
  contents: read

concurrency:
  group: agent-job-${{ github.ref }}
  cancel-in-progress: false

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      JOB_PROMPT: ${{ inputs.prompt }}
      JOB_MODEL: ${{ inputs.model }}
      JOB_VERIFY: ${{ inputs.verify_cmd }}
      JOB_TIMEOUT: ${{ inputs.timeout_sec }}
      JOB_ATTEMPTS: ${{ inputs.max_attempts }}
      RUN_BASE: ${{ runner.temp }}/oc24-runs
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install opencode CLI (policies need 2.0.32 or newer)
        run: npm i -g @opencode/cli@2.0.32

      - name: Record the actual opencode version
        run: opencode --version

      - name: Prove the workflow token cannot push (least privilege)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          perms=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}")
          # the API pretty-prints; flatten before matching
          flat=$(printf '%s' "$perms" | tr -d '\n\r\t ')
          found=$(printf '%s' "$flat" | grep -o '"permissions":{[^}]*}' || true)
          if [ -z "$found" ]; then
            echo "::error::could not read token permissions from the API; refusing to assume read-only"
            exit 1
          fi
          echo "$found"
          if printf '%s' "$flat" | grep -Eq '"push":true'; then
            echo "::error::the workflow token has push permission; this job must stay read-only"
            exit 1
          fi
          echo "token is read-only for this repository"

      - name: Import opencode credentials
        env:
          # contents of `opencode auth export`; optional if the chosen model needs no auth
          OPENCODE_AUTH_JSON: ${{ secrets.OPENCODE_AUTH_JSON }}
        run: |
          if [ -n "$OPENCODE_AUTH_JSON" ]; then
            printf '%s' "$OPENCODE_AUTH_JSON" | opencode auth import
          else
            echo "OPENCODE_AUTH_JSON secret not set; continuing without imported credentials"
          fi

      - name: Run agent job
        id: agent
        run: |
          extra=()
          if [ -n "$JOB_VERIFY" ]; then extra+=(--verify-cmd "$JOB_VERIFY"); fi
          # set -e is active: capture the code instead of aborting the step
          code=0
          node runner/run-job.mjs \
            --workspace "$GITHUB_WORKSPACE" \
            --run-base "$RUN_BASE" \
            --model "$JOB_MODEL" \
            --prompt "$JOB_PROMPT" \
            --timeout-sec "$JOB_TIMEOUT" \
            --max-attempts "$JOB_ATTEMPTS" \
            --max-cost-usd 0 \
            --require-cost-report \
            "${extra[@]}" || code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Job summary
        if: always()
        run: |
          for f in "$RUN_BASE"/*/summary.md; do
            [ -f "$f" ] && cat "$f" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "exit_code=${{ steps.agent.outputs.exit_code }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Scan the run directory for secret leaks
        id: scan
        if: always()
        env:
          OPENCODE_AUTH_JSON: ${{ secrets.OPENCODE_AUTH_JSON }}
        run: |
          if [ -d "$RUN_BASE" ]; then
            node tools/scan-run-dir.mjs "$RUN_BASE"
            echo "clean=true" >> "$GITHUB_OUTPUT"
          else
            echo "no run directory; nothing to scan"
            echo "clean=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload job artifacts
        # upload only when the scan proved the artifacts are clean (fail closed)
        if: always() && steps.scan.outputs.clean == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: oc24-job-${{ github.run_id }}
          path: ${{ runner.temp }}/oc24-runs
          retention-days: 7
          if-no-files-found: warn

      - name: Fail when the job did not succeed
        if: steps.agent.outputs.exit_code != '0'
        run: exit 1
